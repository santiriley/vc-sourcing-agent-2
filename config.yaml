enable_cse: true
cse_queries:
  - '(post-revenue OR "paying customers" OR ingresos OR facturación) (seed OR "pre-seed" OR ronda) (Costa Rica OR Guatemala OR El Salvador OR Honduras OR Nicaragua OR Panama OR Belize OR Colombia OR Venezuela OR Ecuador OR Peru OR Bolivia OR Chile OR Argentina OR Uruguay OR Paraguay OR Brazil)'
feeds_extra:
  - 'https://www.prnewswire.com/news-releases/news-releases-list/?rss=1&lang=es'   # example; swap for LATAM endpoints you want
  - 'https://www.businesswire.com/portal/site/home/news/subject/?vnsId=31300&newsLang=es&rss=1' # example
  - 'https://medium.com/feed/500-startups-latam'   # 500 LatAm
  - 'https://startups.com/feed'                    # replace w/ Startupeable/Startups Latam feeds you pick
weights:
  geo: 3
  post_revenue: 3
  female: 2
  enterprise: 1
  fintech_penalty: -2
rules:
  must_have_any:
    revenue_indicators:
      terms:
        - post-revenue
        - ingresos
        - facturación
        - MRR
        - ARR
        - clientes de pago
        - contrato
        - invoices
        - compras recurrentes
      reason: POST_REVENUE
      missing_reason: NO_REVENUE
  must_have_geo:
    countries:
      - Costa Rica
      - Guatemala
      - El Salvador
      - Honduras
      - Nicaragua
      - Panama
      - Belize
      - Colombia
      - Venezuela
      - Ecuador
      - Peru
      - Bolivia
      - Chile
      - Argentina
      - Uruguay
      - Paraguay
      - Brazil
    reason: GEO
    missing_reason: NO_GEO
  exclude_if_any:
    terms:
      - pre-revenue
      - idea
      - hackathon
      - seeking cofounder
      - curso
      - bootcamp
    reason: EXCLUDE
  sector_penalties:
    fintech:
      terms:
        - wallet
        - lending
        - BNPL
        - neobank
        - crypto
        - remittances
      reason: FINTECH
  enterprise_bonus:
    terms:
      - B2B
      - enterprise
      - pilot
      - paid pilot
      - contrato
      - cliente corporativo
    reason: ENTERPRISE
  female_bonus:
    terms:
      - fundadora
      - cofundadora
      - "co-founder (she/her)"
    reason: FEMALE_FOUNDER
thresholds:
  min_score_to_append: 4
  min_score_to_review: 2
